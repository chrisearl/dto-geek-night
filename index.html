<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DTO Geek Night - A tech & creative meetup event">
    <meta name="keywords" content="DTO, Geek Night, Technology, Creative, Business, Entrepreneurship, Design, UX, UI, Meetup, Tech Event">
    <meta name="author" content="DTO Geek Night">
    <meta name="theme-color" content="#ffc704">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dtogeeknight.com/">
    <meta property="og:title" content="DTO Geek Night">
    <meta property="og:description" content="Coming Soon! Join us for an evening of tech & creative talks, and networking">
    <meta property="og:image" content="https://dtogeeknight.com/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://dtogeeknight.com/">
    <meta property="twitter:title" content="DTO Geek Night">
    <meta property="twitter:description" content="Coming Soon! Join us for an evening of tech & creative talks, and networking">
    <meta property="twitter:image" content="https://dtogeeknight.com/Entrepreneurship">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/dto-gn.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/dto-gn.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/dto-gn.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <title>DTO Geek Night</title>

    <style>
        :host {
            display: block;
            height: 100vh;
            width: 100vw;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .site {
            background-color: #ffc704;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .page {
            display: grid;
            grid-template: 1fr / 1fr;
            height: 100%;
            overflow: hidden;
            width: 100%;
        }

        .map-container,
        .logo-container {
            align-items: center;
            display: flex;
            grid-column: 1;
            grid-row: 1;
            justify-content: center;
            overflow: hidden;
        }

        .map-container {
            position: relative;
            z-index: 1;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .logo {
            width: 40vw;
        }
        
        @media screen and (max-width: 768px) {
            .logo {
                width: 88vw;
            }
        }
    </style>
</head>
<body class="site">
    <main aria-label="DTO Geek Night" class="page">
        <div class="map-container"><img src="assets/images/map-25.png" alt="map lines of the city of Orlando, FL" class="map"></div>
        <div class="logo-container"><img src="assets/images/dto-gn-overlap-wd-ds.png" alt="DTOGN - DTO Geek Night" class="logo"></div>
    </main>
</body>
</html>
